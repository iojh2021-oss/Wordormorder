<body><div id="app"><header><div><span class="brand">وارون</span><span class="status"> / دو سوی یک مسیر</span></div><div class="status" id="stage">مرحله ۱ از ۳ · دره‌ی سپیده</div></header>
<main id="views"><section class="panel" id="p1"><canvas id="top"></canvas><div class="tag"><b>▲ زمان اصلی</b> · حرکت به جلو</div><div class="hud" id="h1">۰٪ · امتیاز ۰</div></section><div id="divider">⇅</div><section class="panel reverse" id="p2"><canvas id="bottom"></canvas><div class="tag"><b>▼ زمان وارونه</b> · بازگشت از انتها</div><div class="hud" id="h2">۱۰۰٪ · وارون</div></section></main>
<footer><div class="row"><div class="group"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="Space">پرش</button></div><div class="group"><button id="play">شروع</button><button id="sound">صدا روشن</button><button id="reset">از نو ↻</button></div></div><div id="message">جهت‌ها/WASD: حرکت و چرخش دوربین · جمع‌آوری کریستال‌ها · عبور از موانع · <span id="result">بهترین رکورد: ۰</span></div></footer></div>
<script type="module">
let THREE;
try { THREE = await import('three'); }
catch(firstError) {
  try { THREE = await import('https://unpkg.com/three@0.160.0/build/three.module.js'); }
  catch(secondError) {
    try { THREE = await import('https://esm.sh/three@0.160.0'); }
    catch(finalError) {
      document.querySelectorAll('.panel').forEach(p=>{p.innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#ffd27b;line-height:2">کتابخانه سه‌بعدی بارگذاری نشد.<br>اتصال اینترنت یا دسترسی به CDN را بررسی و صفحه را دوباره بارگذاری کن.<br><small style="color:#a9bdd5">WebGL / Three.js unavailable</small></div>';});
      throw finalError;
    }
  }
}
try {
const $=id=>document.getElementById(id), L=108, stageNames=['دره‌ی سپیده','جنگل نیمه‌شب','پل آینه‌ای'];
const themes=[{sky:0x9b9eb6,fog:0x9b9eb6,ground:0x263b43,glow:0xffd18b},{sky:0x09152c,fog:0x09152c,ground:0x102326,glow:0x70e8da},{sky:0x59456f,fog:0x59456f,ground:0x29334c,glow:0xe8baff}];
let progress=0,x=0,velY=0,jump=0,yaw=0,score=0,playing=false,won=false,keys=new Set(),soundOn=true,ac=null,musicTimer=0,elapsed=0,items=[],hazards=[],collected=new Set(),hitFlash=0;
const bestKey='waroon-best-v2';let best=Number(localStorage.getItem(bestKey)||0);$('result').textContent='بهترین رکورد: '+best;
function makeWorld(canvas,reverse){
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(66,1,.1,260);scene.fog=new THREE.Fog(0x9b9eb6,35,155);
 scene.add(new THREE.HemisphereLight(0xc6e6ff,0x27313b,2.0));const sun=new THREE.DirectionalLight(0xffe0b0,2.8);sun.position.set(-12,25,22);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,280),new THREE.MeshStandardMaterial({color:0x263b43,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.08,-48);ground.receiveShadow=true;scene.add(ground);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(9,230),new THREE.MeshStandardMaterial({color:0x303c4b,roughness:.8}));road.rotation.x=-Math.PI/2;road.position.set(0,0,-49);road.receiveShadow=true;scene.add(road);
 const edgeMat=new THREE.MeshStandardMaterial({color:0x86dcd8,emissive:0x174a55,roughness:.4});
 for(const xx of [-4.55,4.55]){let edge=new THREE.Mesh(new THREE.BoxGeometry(.13,.12,220),edgeMat);edge.position.set(xx,.06,-49);scene.add(edge);}
 const lineMat=new THREE.MeshStandardMaterial({color:0xc3d4df,emissive:0x253a48});
 for(let z=4;z>-160;z-=8){let dash=new THREE.Mesh(new THREE.BoxGeometry(.09,.025,2.4),lineMat);dash.position.set(0,.025,z);scene.add(dash);}
 // landscape, trees, rocks and gates
 for(let i=0;i<76;i++){const z=5-i*2.15;for(const side of [-1,1]){const xx=side*(7+(i*7%12));const tree=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.7,7),new THREE.MeshStandardMaterial({color:0x574638}));trunk.position.y=.85;trunk.castShadow=true;tree.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.9+(i%3)*.18,2.7,7),new THREE.MeshStandardMaterial({color:i%3===0?0x285c54:0x24433e,roughness:1}));crown.position.y=2.65;crown.castShadow=true;tree.add(crown);tree.position.set(xx,0,z);scene.add(tree);}}
 for(let s=0;s<3;s++){const z=-s*36-16;const gate=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:themes[s].glow,emissive:themes[s].glow,emissiveIntensity:.55,metalness:.35,roughness:.3});for(const xx of [-2.2,2.2]){const post=new THREE.Mesh(new THREE.BoxGeometry(.22,5,.3),mat);post.position.set(xx,2.5,z);gate.add(post);}const top=new THREE.Mesh(new THREE.BoxGeometry(4.6,.22,.3),mat);top.position.set(0,5,z);gate.add(top);scene.add(gate);}
 // character with visible articulated limbs
 const avatar=new THREE.Group();const skin=new THREE.MeshStandardMaterial({color:0xe3b18b,roughness:.7}),suit=new THREE.MeshStandardMaterial({color:0x20a5a4,metalness:.2,roughness:.5}),dark=new THREE.MeshStandardMaterial({color:0x17263b,roughness:.8}),visor=new THREE.MeshStandardMaterial({color:0x9cf7f0,metalness:.6,roughness:.2,emissive:0x164a54});
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.78,5,10),suit);torso.position.y=1.55;torso.castShadow=true;avatar.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),skin);head.position.y=2.35;head.castShadow=true;avatar.add(head);
 const face=new THREE.Mesh(new THREE.BoxGeometry(.38,.13,.08),visor);face.position.set(0,2.38,-.245);avatar.add(face);
 const limbParts=[];
 for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.48,1.9,0);const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.42,4,8),suit);upper.position.y=-.25;arm.add(upper);const hand=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),skin);hand.position.y=-.54;arm.add(hand);avatar.add(arm);limbParts.push(arm);
 const leg=new THREE.Group();leg.position.set(side*.22,1.12,0);const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.48,4,8),dark);thigh.position.y=-.32;leg.add(thigh);const boot=new THREE.Mesh(new THREE.BoxGeometry(.28,.16,.42),dark);boot.position.set(0,-.62,-.1);leg.add(boot);avatar.add(leg);limbParts.push(leg);}
 avatar.position.set(0,0,0);scene.add(avatar);
 // crystals and barriers
 const localItems=[],localHazards=[];
 for(let i=0;i<15;i++){const z=-7-i*6.3,xx=[-2.2,0,2.2][i%3];const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0x7ff7ee,emissive:0x1a8c8d,emissiveIntensity:1.1,metalness:.4,roughness:.2}));gem.position.set(xx,1.15,z);gem.castShadow=true;scene.add(gem);localItems.push({mesh:gem,z,x:xx,id:i});}
 for(let i=0;i<13;i++){const z=-12-i*7.2,xx=[-2.4,0,2.4][(i+1)%3];const box=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.7,.8),new THREE.MeshStandardMaterial({color:i%2?0x9c5269:0x9a7443,roughness:.7}));box.position.set(xx,.85,z);box.castShadow=true;scene.add(box);localHazards.push({mesh:box,z,x:xx,id:i});}
 const stars=new THREE.Group();for(let i=0;i<150;i++){const star=new THREE.Mesh(new THREE.SphereGeometry(.07,5,5),new THREE.MeshBasicMaterial({color:0xffffff}));star.position.set((Math.random()-.5)*100,8+Math.random()*35,-Math.random()*180);stars.add(star);}scene.add(stars);
 return {renderer,scene,camera,avatar,limbParts,ground,road,stars,localItems,localHazards,sun,reverse};
}
const A=makeWorld($('top'),false),B=makeWorld($('bottom'),true);
function resize(){for(const w of [A,B]){const r=w.renderer.domElement.getBoundingClientRect();w.renderer.setSize(r.width,r.height,false);w.camera.aspect=r.width/Math.max(1,r.height);w.camera.updateProjectionMatrix();}}new ResizeObserver(resize).observe($('views'));resize();
function themeWorld(w,p){const idx=Math.min(2,Math.floor(p*3));const t=themes[idx];w.scene.background=new THREE.Color(t.sky);w.scene.fog.color.setHex(t.fog);w.ground.material.color.setHex(t.ground);w.sun.color.setHex(t.glow);}
function animateWorld(w,p,rev,now){const z=rev?-(1-p)*L:-p*L,xx=x*(rev?-1:1),avatar=w.avatar;avatar.position.set(xx,jump,z);avatar.rotation.y=rev?Math.PI-yaw:yaw;const gait=playing&&jump<.1?Math.sin(now*12)*.62:0;w.limbParts.forEach((part,i)=>{part.rotation.x=(i%2===0?1:-1)*gait;});const cameraZ=rev?z-7:z+7,lookZ=rev?z+8:z-8;w.camera.position.set(xx*.72,3.5+jump*.45,cameraZ);const look=new THREE.Vector3(xx*.7,1.3+jump*.2,lookZ);w.camera.lookAt(look);w.camera.rotation.z=rev?-yaw*.16:yaw*.16;w.localItems.forEach(it=>{it.mesh.rotation.y=now*.8+it.id;it.mesh.rotation.x=now*.5;if(collected.has(it.id))it.mesh.visible=false;});w.localHazards.forEach(h=>h.mesh.rotation.y=Math.sin(now+h.id)*.08);themeWorld(w,rev?1-p:p);w.renderer.render(w.scene,w.camera);}
function updateUI(){const p=Math.round(progress*100);$('h1').textContent=p+'٪ · امتیاز '+score+' · کریستال '+collected.size+'/15';$('h2').textContent=(100-p)+'٪ · تصویر معکوس';const s=Math.min(2,Math.floor(progress*3));$('stage').textContent='مرحله '+(s+1)+' از ۳ · '+stageNames[s];}
function initAudio(){if(!soundOn)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();buildMusic();}
function synthBuffer(reverse=false){
 const duration=8,frames=Math.floor(ac.sampleRate*duration),buffer=ac.createBuffer(2,frames,ac.sampleRate);
 const notes=[196,246.94,293.66,392,329.63,293.66,246.94,220];
 for(let ch=0;ch<2;ch++){const data=buffer.getChannelData(ch);for(let i=0;i<frames;i++){const t=i/ac.sampleRate,beat=Math.floor(t/.5)%8,local=(t% .5)/.5;const env=Math.pow(Math.sin(Math.PI*local),1.5);const f=notes[beat]*(ch===0?1:.5);let sample=Math.sin(2*Math.PI*f*t)*.34+Math.sin(2*Math.PI*f*2*t)*.09;sample+=Math.sin(2*Math.PI*notes[(beat+2)%8]*t)*.06;data[i]=sample*env;}}
 if(reverse){for(let ch=0;ch<2;ch++){const d=buffer.getChannelData(ch);for(let i=0,j=d.length-1;i<j;i++,j--){const v=d[i];d[i]=d[j];d[j]=v;}}}
 return buffer;
}
let musicSources=[];
function stopMusic(){musicSources.forEach(s=>{try{s.stop()}catch(e){}});musicSources=[];}
function buildMusic(){if(!ac||musicSources.length)return;const original=synthBuffer(false),reversed=synthBuffer(true);
 for(const [buffer,pan] of [[original,-.48],[reversed,.48]]){const src=ac.createBufferSource(),gain=ac.createGain(),panner=ac.createStereoPanner();src.buffer=buffer;src.loop=true;gain.gain.value=.20;panner.pan.value=pan;src.connect(gain);gain.connect(panner);panner.connect(ac.destination);src.start();musicSources.push(src);}
}
function musicTick(){if(playing&&soundOn&&ac)buildMusic();}
function playNote(freq,time,duration,gain){if(!ac||!soundOn)return;const n=Math.max(256,Math.floor(ac.sampleRate*duration)),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++){const env=Math.sin(Math.PI*i/n)**1.5;d[i]=Math.sin(2*Math.PI*freq*i/ac.sampleRate)*env*.5;}const src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;g.gain.value=gain;src.connect(g);g.connect(ac.destination);src.start(time);}
function sfx(freq=520){if(!ac||!soundOn)return;playNote(freq,ac.currentTime,.14,.09);}
function completeStage(){const stage=Math.min(2,Math.floor(progress*3));if(stage<2&&progress>=(stage+1)/3){score+=100;}}
function tick(dt,now){if(playing){elapsed+=dt;let forward=(keys.has('ArrowUp')||keys.has('w'))?1:0;let backward=(keys.has('ArrowDown')||keys.has('s'))?1:0;progress=THREE.MathUtils.clamp(progress+(forward-backward)*dt*.075,0,1);if(keys.has('ArrowLeft')||keys.has('a'))yaw=THREE.MathUtils.clamp(yaw+dt*1.5,-.65,.65);if(keys.has('ArrowRight')||keys.has('d'))yaw=THREE.MathUtils.clamp(yaw-dt*1.5,-.65,.65);if(keys.has('ArrowLeft')||keys.has('a'))x=THREE.MathUtils.clamp(x-dt*3.2,-3.1,3.1);if(keys.has('ArrowRight')||keys.has('d'))x=THREE.MathUtils.clamp(x+dt*3.2,-3.1,3.1);
 if(jump>0||velY>0){jump+=velY*dt;velY-=10*dt;if(jump<=0){jump=0;velY=0;}}
 const z=-progress*L;for(const it of A.localItems){if(!collected.has(it.id)&&Math.abs(z-it.z)<1.35&&Math.abs(x-it.x)<1.15){collected.add(it.id);score+=25;sfx(780);}}
 for(const h of A.localHazards){if(Math.abs(z-h.z)<1.05&&Math.abs(x-h.x)<1.05&&jump<1.15){progress=Math.max(0,progress-.025);score=Math.max(0,score-8);hitFlash=.25;sfx(110);}}
 if(progress>=1){playing=false;won=true;score+=250;best=Math.max(best,score);localStorage.setItem(bestKey,String(best));$('result').textContent='بهترین رکورد: '+best;$('play').textContent='پایان بازی ✓';$('message').firstChild.textContent='هر سه مرحله را پشت سر گذاشتی! ';}}
 animateWorld(A,progress,false,now);animateWorld(B,1-progress,true,now);updateUI();requestAnimationFrame(loop);}
let last=0;function loop(ms){const now=ms/1000,dt=Math.min(.04,(ms-last)/1000||0);last=ms;tick(dt,now);}
requestAnimationFrame(loop);
function start(){initAudio();if(won)reset();playing=!playing;$('play').textContent=playing?'توقف':'ادامه';if(playing)musicTick();else stopMusic();}
function reset(){progress=0;x=0;yaw=0;jump=0;velY=0;score=0;elapsed=0;playing=false;won=false;collected.clear();A.localItems.concat(B.localItems).forEach(i=>i.mesh.visible=true);$('play').textContent='شروع';$('message').firstChild.textContent='جهت‌ها/WASD: حرکت و چرخش دوربین · جمع‌آوری کریستال‌ها · عبور از موانع · ';}
$('play').onclick=start;$('reset').onclick=reset;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='صدا '+(soundOn?'روشن':'خاموش');if(soundOn){initAudio();if(playing)buildMusic();}else stopMusic();};
function press(k){if(k==='Space'){if(jump===0&&playing){velY=5.5;sfx(650);}return;}keys.add(k);}function release(k){keys.delete(k);}
window.addEventListener('keydown',e=>{const k=e.code==='Space'?'Space':e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();if(!e.repeat)press(k);});window.addEventListener('keyup',e=>release(e.code==='Space'?'Space':e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();press(k);b.classList.add('active');});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{release(k);b.classList.remove('active');});});
} catch(error) {
 const msg=(error&&error.message)?error.message:String(error);
 document.querySelectorAll('.panel').forEach(p=>{const box=document.createElement('div');box.style.cssText='position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#ffd27b;line-height:2;background:#101b2b';box.innerHTML='خطا در راه‌اندازی موتور سه‌بعدی<br><small style="color:#b8c8d9"></small>';box.querySelector('small').textContent=msg;p.appendChild(box);});
 console.error('Waroon startup error:',error);
}
</script></body></html>
